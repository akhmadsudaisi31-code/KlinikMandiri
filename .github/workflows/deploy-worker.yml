name: Deploy Cloudflare Worker Backend

on:
  push:
    branches:
      - main
    paths:
      - 'my-cloudflare-backend/**'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: my-cloudflare-backend/package.json

      - name: Install Dependencies
        working-directory: my-cloudflare-backend
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'my-cloudflare-backend'
